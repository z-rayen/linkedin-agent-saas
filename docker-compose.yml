services:
  db:
    # Pinned by digest. The database is published on 127.0.0.1 only.
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: linkedin-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkedin
      # Required. Set it in a root .env file next to this compose file, or in your shell.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (root .env or shell)}
      POSTGRES_DB: linkedin_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkedin -d linkedin_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Secrets come from backend/.env. The database host is overridden: inside the network it is "db", not localhost.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://linkedin:${POSTGRES_PASSWORD}@db:5432/linkedin_agent
      # The Windows path of backend/.env does not exist in the container. The image installs Tectonic here.
      TECTONIC_PATH: /usr/local/bin/tectonic
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./frontend
      args:
        # Same-origin API path, proxied by nginx to the api service.
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

volumes:
  pgdata:
