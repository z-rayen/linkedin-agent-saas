<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p><a href="profile.html">⚙️ Configurer mon profil</a></p>
  <div class="card" style="width: 500px;">
    <h2>Dashboard</h2>
    <p id="linkedin-status"></p>
    <button onclick="connectLinkedIn()">Connecter LinkedIn</button>
    <br><br>
    <button onclick="logout()" style="background:#888;">Se déconnecter</button>
    <button onclick="connectGitHub()">Connecter GitHub</button>
<h3>Mes repos GitHub</h3>
<div id="repos-list"></div>
    <hr>
<h3>Générer un post</h3>
<input type="text" id="post-title" placeholder="Titre du projet">
<textarea id="post-context" placeholder="Contexte / description" style="width:100%; padding:8px; margin-bottom:10px;"></textarea>
<button onclick="generatePost()">Générer</button>
<p id="gen-msg"></p>
<hr>
<hr>
<h3>🔎 Agent de recherche</h3>
<div id="agent-chat"></div>
<textarea id="agent-input" placeholder="Ex: Trouve des certifications gratuites en ML" style="width:100%; padding:8px; margin-bottom:10px;"></textarea>
<button onclick="askAgent()">Envoyer</button>
<button onclick="clearAgentHistory()" style="background:#888; margin-top:8px;">Effacer l'historique</button>
<div id="queue-list"></div>
  </div>
  <hr>
<h3>💬 Suggestions de commentaires</h3>
<input type="text" id="engage-topic" placeholder="Sujet (ex: MLOps, transformers, time series)">
<button onclick="suggestComments()">Trouver des posts</button>
<div id="engage-results"></div>
  <hr>
<h3>Veille offres & certifications</h3>
<button onclick="runWatch()">Lancer la veille</button>
<p id="watch-msg"></p>
<div id="watch-results"></div>
  <script src="app.js"></script>
  <script>
    // Vérifie le retour LinkedIn (?linkedin=connected dans l'URL)
    const params = new URLSearchParams(window.location.search);
    if (params.get('linkedin') === 'connected') {
      document.getElementById('linkedin-status').innerHTML = '<span class="success">✅ LinkedIn connecté !</span>';
    }
  </script>
</body>
</html>
