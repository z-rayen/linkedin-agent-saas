<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Configuration du profil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" style="width: 500px;">
    <h2>Configuration du profil</h2>
    
    <label>Domaine</label>
    <input type="text" id="field" placeholder="ex: Machine Learning, Data Science">
    
    <label>Compétences (séparées par virgules)</label>
    <input type="text" id="skills" placeholder="ex: Python, TensorFlow, NLP">
    
    <label>Niveau</label>
    <input type="text" id="level" placeholder="ex: Student / Junior">
    
    <label>Score minimum de pertinence (0-100)</label>
    <input type="number" id="min_match_score" value="70">
    
    <label>URL flux RSS offres d'emploi</label>
    <input type="text" id="job_feed_url" placeholder="https://...">
    
    <label>URL flux RSS certifications</label>
    <input type="text" id="cert_feed_url" placeholder="https://...">
    
    <button onclick="saveProfile()">Sauvegarder</button>
    <p id="profile-msg"></p>
    <hr>
<h3>🧠 Ma base de connaissances</h3>
<p><small>Une entrée = un projet ou une compétence, en 2 à 5 phrases (le modèle lit surtout le début du texte). Ex : « Projet X (cours/perso). Stack : ... Résultat : ... »</small></p>
<textarea id="knowledge-input" rows="4" style="width:100%; padding:8px; margin-bottom:10px;"></textarea>
<button onclick="addKnowledge()">Ajouter</button>
<p id="knowledge-msg"></p>
<div id="knowledge-list"></div>
    <p><a href="dashboard.html">← Retour au dashboard</a></p>
  </div>
  <script src="app.js"></script>
  <script>loadProfile();</script>
</body>
</html>
