name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: linkedin_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d linkedin_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5433/linkedin_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest --cov --cov-report=xml
      - run: uv run pytest -m integration -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml

  cv-compile:
    # The opt-in Tectonic tests, required here: REQUIRE_TECTONIC=1 makes a missing binary an error, never a skip.
    # Tectonic is installed exactly as the Docker image installs it: pinned version, checksum verified.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TECTONIC_VERSION: "0.17.0"
      TECTONIC_SHA256_AMD64: "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7"
      TARGETARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the pinned Tectonic (checksum-verified)
        run: sudo --preserve-env=TARGETARCH,TECTONIC_VERSION,TECTONIC_SHA256_AMD64 python3 docker/install_tectonic.py
      - run: uv sync
      - name: Real CV compilations
        run: uv run pytest tests/test_cv_tectonic_integration.py -q -rs
        env:
          TEST_TECTONIC_PATH: /usr/local/bin/tectonic
          REQUIRE_TECTONIC: "1"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    # Format, lint, types, tests (including the OpenAPI contract), then the production build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:types
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t linkedin-agent-api:ci ./backend
      - name: Build frontend image
        run: docker build -t linkedin-agent-web:ci ./frontend

  audit:
    # Secrets and personal data in the files that would be committed (the same script as the pre-commit hook).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/audit_tracked.py

  compose:
    # The stack's configuration is valid, with the variables it requires. The values are CI-only and empty files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the env files compose reads (empty: the configuration is checked, not run)
        run: touch backend/.env .env
      - name: Validate the compose file
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-password
