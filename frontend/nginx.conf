# Serves the React build and forwards /api/ to the API container. The API receives paths without the /api prefix,
# exactly as the Vite dev proxy forwards them, so the frontend code is the same in development and in production.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (for example /applications/12) are answered by the app itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API host is resolved when a request arrives, not when nginx starts, so the web container can start before the
    # API is reachable. 127.0.0.11 is the embedded DNS server of Docker networks.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preparations and PDF rendering can take minutes: the proxy must wait for the API.
        proxy_read_timeout 300s;
        # Progress streams are sent as they are produced, not buffered.
        proxy_buffering off;
    }
}
